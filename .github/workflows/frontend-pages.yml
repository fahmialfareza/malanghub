name: Deploy Frontend to Cloudflare Pages

# Builds and deploys here instead of in Pages' own Git builds: Pages CI
# re-bundles _worker.js with its built-in wrangler 3, which breaks Next's
# module loading, and it ignores dashboard build variables when the project
# has a wrangler config.

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - "packages/**"
      - "patches/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/frontend-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Inlined into the client bundle at build time.
      NEXT_PUBLIC_API_ADDRESS: ${{ secrets['NEXT_PUBLIC_API_ADDRESS'] }}
      NEXT_PUBLIC_NEXT_API_ADDRESS: ${{ secrets['NEXT_PUBLIC_NEXT_API_ADDRESS'] }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets['NEXT_PUBLIC_GOOGLE_CLIENT_ID'] }}
      NEXT_PUBLIC_FACEBOOK_APP_ID: ${{ secrets['NEXT_PUBLIC_FACEBOOK_APP_ID'] }}
      NEXT_PUBLIC_TINY_API_KEY: ${{ secrets['NEXT_PUBLIC_TINY_API_KEY'] }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets['NEXT_PUBLIC_SENTRY_DSN'] }}
      NEXT_PUBLIC_INDEXNOW_KEY: ${{ secrets['NEXT_PUBLIC_INDEXNOW_KEY'] }}
      # Sentry source map upload during `next build`.
      SENTRY_AUTH_TOKEN: ${{ secrets['SENTRY_AUTH_TOKEN'] }}
      SENTRY_ORG: ${{ secrets['SENTRY_ORG'] }}
      SENTRY_PROJECT: ${{ secrets['SENTRY_PROJECT'] }}
      SENTRY_SUPPRESS_TURBOPACK_WARNING: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets['CLOUDFLARE_API_TOKEN'] }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets['CLOUDFLARE_ACCOUNT_ID'] }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Pages
        run: pnpm --filter client pages:build

      # Runtime values (API_ADDRESS, INDEXNOW_KEY, SENTRY_DSN) are Pages
      # secrets, set once with `wrangler pages secret put`.
      - name: Deploy to Cloudflare Pages
        working-directory: apps/frontend/cloudflare-pages
        run: >-
          ../node_modules/.bin/wrangler pages deploy
          --branch "${GITHUB_REF_NAME}"
          --commit-hash "${GITHUB_SHA}"
          --commit-message "$(git log -1 --pretty=%s)"
