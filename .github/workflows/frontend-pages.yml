name: Deploy Frontend to Cloudflare Pages

# The site is a static export (no Worker), so content only changes when it
# is rebuilt: on push, when the backend publishes or edits content
# (repository_dispatch from apps/backend/pkg/sitebuild), and every 6 hours to
# refresh trending lists and the Google News sitemap window.

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/frontend-pages.yml"
  repository_dispatch:
    types: [content-changed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One build at a time; GitHub keeps only the newest pending run, so a burst
# of content changes collapses into one more build.
concurrency:
  group: frontend-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Inlined into the client bundle at build time.
      NEXT_PUBLIC_API_ADDRESS: ${{ secrets['NEXT_PUBLIC_API_ADDRESS'] }}
      # Build-time data source for getStaticProps and the SEO files.
      API_ADDRESS: ${{ secrets['NEXT_PUBLIC_API_ADDRESS'] }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets['NEXT_PUBLIC_GOOGLE_CLIENT_ID'] }}
      NEXT_PUBLIC_FACEBOOK_APP_ID: ${{ secrets['NEXT_PUBLIC_FACEBOOK_APP_ID'] }}
      NEXT_PUBLIC_TINY_API_KEY: ${{ secrets['NEXT_PUBLIC_TINY_API_KEY'] }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets['NEXT_PUBLIC_SENTRY_DSN'] }}
      NEXT_PUBLIC_INDEXNOW_KEY: ${{ secrets['NEXT_PUBLIC_INDEXNOW_KEY'] }}
      # Sentry source map upload during `next build`.
      SENTRY_AUTH_TOKEN: ${{ secrets['SENTRY_AUTH_TOKEN'] }}
      SENTRY_ORG: ${{ secrets['SENTRY_ORG'] }}
      SENTRY_PROJECT: ${{ secrets['SENTRY_PROJECT'] }}
      SENTRY_SUPPRESS_TURBOPACK_WARNING: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets['CLOUDFLARE_API_TOKEN'] }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets['CLOUDFLARE_ACCOUNT_ID'] }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Pages
        run: pnpm --filter client pages:build

      # Taken before deploying, to find which URLs this deploy changes.
      - name: Save the live sitemap
        run: curl -fsS https://www.malanghub.com/sitemap.xml -o "$RUNNER_TEMP/live-sitemap.xml" || true

      # Repository dispatches and cron runs check out the default branch,
      # so they always deploy to production.
      - name: Deploy to Cloudflare Pages
        working-directory: apps/frontend
        run: >-
          node_modules/.bin/wrangler pages deploy out
          --project-name malanghub
          --branch main
          --commit-hash "${GITHUB_SHA}"
          --commit-message "$(git log -1 --pretty=%s)"

      - name: Ping IndexNow for changed URLs
        working-directory: apps/frontend
        run: node scripts/submit-indexnow.mts "$RUNNER_TEMP/live-sitemap.xml"
